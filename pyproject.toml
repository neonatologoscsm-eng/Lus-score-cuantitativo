[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlus"
version = "0.1.0"
description = "LUS score neonatal cuantitativo (qLUS-Neo): segmentación con IA y cuantificación ecográfica determinística"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pydicom>=2.4",
    "pillow>=10",          # decodifica DICOM comprimidos en JPEG (lo habitual en ecógrafos)
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
jpeg = ["pylibjpeg>=2", "pylibjpeg-libjpeg>=2"]  # DICOM en JPEG sin pérdida / JPEG-LS

[project.scripts]
qlus = "qlus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
